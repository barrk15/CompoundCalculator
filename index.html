<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    let currentMode = 'growth';
    let currentFrequency = { growth: 'monthly', withdrawal: 'yearly' };
    let chartInstance = null;

    // Mode toggle
    document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentMode = btn.dataset.mode;
            
            document.getElementById('growth-calc').classList.toggle('hidden', currentMode !== 'growth');
            document.getElementById('withdrawal-calc').classList.toggle('hidden', currentMode !== 'withdrawal');
            
            calculate();
        });
    });

    // Frequency selector
    document.querySelectorAll('.frequency-selector').forEach(selector => {
        selector.querySelectorAll('.frequency-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                selector.querySelectorAll('.frequency-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFrequency[currentMode] = btn.dataset.freq;
                calculate();
            });
        });
    });

    // Input listeners
    document.querySelectorAll('input').forEach(input => {
        input.addEventListener('input', calculate);
    });

    // Format currency inputs with commas
    function formatNumberWithCommas(value) {
        // Remove all non-numeric characters except decimal point
        const numericValue = value.replace(/[^\d.]/g, '');
        // Split into integer and decimal parts
        const parts = numericValue.split('.');
        // Add commas to integer part
        parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        return parts.join('.');
    }

    function removeCommas(value) {
        return value.replace(/,/g, '');
    }

    // Add comma formatting to specific input fields
    const currencyInputs = [
        document.getElementById('growth-balance'),
        document.getElementById('growth-addition'),
        document.getElementById('withdrawal-balance'),
        document.getElementById('withdrawal-amount')
    ];

    currencyInputs.forEach(input => {
        input.addEventListener('blur', function() {
            const rawValue = removeCommas(this.value);
            if (rawValue && !isNaN(rawValue)) {
                this.value = formatNumberWithCommas(rawValue);
            }
        });

        input.addEventListener('focus', function() {
            this.value = removeCommas(this.value);
        });
    });

    // Frequency multipliers
    const frequencyMultipliers = {
        yearly: 1,
        quarterly: 4,
        monthly: 12,
        weekly: 52
    };

    function calculate() {
        if (currentMode === 'growth') {
            calculateGrowth();
        } else {
            calculateWithdrawal();
        }
    }

    function calculateGrowth() {
        const startBalance = parseFloat(removeCommas(document.getElementById('growth-balance').value)) || 0;
        const annualRate = (parseFloat(document.getElementById('growth-rate').value) || 0) / 100;
        const years = parseFloat(document.getElementById('growth-duration').value) || 0;
        const addition = parseFloat(removeCommas(document.getElementById('growth-addition').value)) || 0;
        const freq = currentFrequency.growth;
        const periodsPerYear = frequencyMultipliers[freq];
        
        const ratePerPeriod = annualRate / periodsPerYear;
        const totalPeriods = years * periodsPerYear;
        
        let balance = startBalance;
        
        for (let i = 0; i < totalPeriods; i++) {
            balance = balance * (1 + ratePerPeriod) + addition;
        }
        
        const totalContributions = startBalance + (addition * totalPeriods);
        const profit = balance - totalContributions;
        
        document.getElementById('result-label-1').textContent = 'Investment Value';
        document.getElementById('result-value-1').textContent = formatCurrency(balance);
        document.getElementById('result-label-2').textContent = 'Contributions';
        document.getElementById('result-value-2').textContent = formatCurrency(totalContributions);
        document.getElementById('result-label-3').textContent = 'Profit';
        document.getElementById('result-value-3').textContent = formatCurrency(profit);
    }

    function calculateWithdrawal() {
        const startBalance = parseFloat(removeCommas(document.getElementById('withdrawal-balance').value)) || 0;
        const annualRate = (parseFloat(document.getElementById('withdrawal-rate').value) || 0) / 100;
        const years = parseFloat(document.getElementById('withdrawal-duration').value) || 0;
        const withdrawal = parseFloat(removeCommas(document.getElementById('withdrawal-amount').value)) || 0;
        const inflation = (parseFloat(document.getElementById('withdrawal-inflation').value) || 0) / 100;
        const freq = currentFrequency.withdrawal;
        const periodsPerYear = frequencyMultipliers[freq];
        
        const ratePerPeriod = annualRate / periodsPerYear;
        const inflationPerPeriod = inflation / periodsPerYear;
        const totalPeriods = years * periodsPerYear;
        
        let balance = startBalance;
        let currentWithdrawal = withdrawal / periodsPerYear;
        let totalWithdrawn = 0;
        let timeToZero = totalPeriods;
        
        for (let i = 0; i < totalPeriods; i++) {
            balance = balance * (1 + ratePerPeriod) - currentWithdrawal;
            totalWithdrawn += currentWithdrawal;
            
            if (balance <= 0 && timeToZero === totalPeriods) {
                timeToZero = i;
                balance = 0;
                break;
            }
            
            currentWithdrawal *= (1 + inflationPerPeriod);
        }
        
        document.getElementById('result-label-1').textContent = 'Ending Balance';
        document.getElementById('result-value-1').textContent = formatCurrency(Math.max(0, balance));
        document.getElementById('result-label-2').textContent = 'Total Withdrawal';
        document.getElementById('result-value-2').textContent = formatCurrency(totalWithdrawn);
        document.getElementById('result-label-3').textContent = 'Time to Zero';
        document.getElementById('result-value-3').textContent = timeToZero >= totalPeriods ? 
            `${years}+ years` : `${Math.ceil(timeToZero / periodsPerYear)} years`;
    }

    function formatCurrency(value) {
        return new Intl.NumberFormat('en-US', {
            style: 'currency',
            currency: 'USD',
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }).format(value);
    }

    // Build Graph
    document.getElementById('build-graph').addEventListener('click', () => {
        const chartContainer = document.getElementById('chart-container');
        chartContainer.classList.add('visible');
        chartContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        buildChart();
    });

    // Value by Year
    document.getElementById('value-by-year').addEventListener('click', () => {
        const tableContainer = document.getElementById('year-table-container');
        tableContainer.classList.add('visible');
        tableContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        buildYearTable();
    });

    function buildYearTable() {
        const tableBody = document.getElementById('year-table-body');
        const col3Header = document.getElementById('col-3-header');
        
        tableBody.innerHTML = '';
        
        let data;
        if (currentMode === 'growth') {
            col3Header.textContent = 'Contributions';
            data = generateGrowthYearData();
        } else {
            col3Header.textContent = 'Withdrawals';
            data = generateWithdrawalYearData();
        }
        
        data.forEach(row => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="year-col">${row.year}</td>
                <td class="balance-col">${formatCurrency(row.balance)}</td>
                <td class="contrib-col">${formatCurrency(row.cumulative)}</td>
            `;
            tableBody.appendChild(tr);
        });
    }

    function generateGrowthYearData() {
        const startBalance = parseFloat(removeCommas(document.getElementById('growth-balance').value)) || 0;
        const annualRate = (parseFloat(document.getElementById('growth-rate').value) || 0) / 100;
        const years = parseFloat(document.getElementById('growth-duration').value) || 0;
        const addition = parseFloat(removeCommas(document.getElementById('growth-addition').value)) || 0;
        const freq = currentFrequency.growth;
        const periodsPerYear = frequencyMultipliers[freq];
        
        const ratePerPeriod = annualRate / periodsPerYear;
        
        const data = [];
        let balance = startBalance;
        let totalContributions = startBalance;
        
        data.push({
            year: 0,
            balance: balance,
            cumulative: totalContributions
        });
        
        for (let year = 1; year <= years; year++) {
            for (let period = 0; period < periodsPerYear; period++) {
                balance = balance * (1 + ratePerPeriod) + addition;
                totalContributions += addition;
            }
            
            data.push({
                year: year,
                balance: balance,
                cumulative: totalContributions
            });
        }
        
        return data;
    }

    function generateWithdrawalYearData() {
        const startBalance = parseFloat(removeCommas(document.getElementById('withdrawal-balance').value)) || 0;
        const annualRate = (parseFloat(document.getElementById('withdrawal-rate').value) || 0) / 100;
        const years = parseFloat(document.getElementById('withdrawal-duration').value) || 0;
        const withdrawal = parseFloat(removeCommas(document.getElementById('withdrawal-amount').value)) || 0;
        const inflation = (parseFloat(document.getElementById('withdrawal-inflation').value) || 0) / 100;
        const freq = currentFrequency.withdrawal;
        const periodsPerYear = frequencyMultipliers[freq];
        
        const ratePerPeriod = annualRate / periodsPerYear;
        const inflationPerPeriod = inflation / periodsPerYear;
        
        const data = [];
        let balance = startBalance;
        let currentWithdrawal = withdrawal / periodsPerYear;
        let totalWithdrawn = 0;
        
        data.push({
            year: 0,
            balance: balance,
            cumulative: totalWithdrawn
        });
        
        for (let year = 1; year <= years; year++) {
            for (let period = 0; period < periodsPerYear; period++) {
                balance = balance * (1 + ratePerPeriod) - currentWithdrawal;
                totalWithdrawn += currentWithdrawal;
                currentWithdrawal *= (1 + inflationPerPeriod);
                
                if (balance < 0) {
                    balance = 0;
                    break;
                }
            }
            
            data.push({
                year: year,
                balance: Math.max(0, balance),
                cumulative: totalWithdrawn
            });
            
            if (balance <= 0) break;
        }
        
        return data;
    }

    function buildChart() {
        const ctx = document.getElementById('myChart').getContext('2d');
        
        if (chartInstance) {
            chartInstance.destroy();
        }

        let data;
        if (currentMode === 'growth') {
            data = generateGrowthData();
        } else {
            data = generateWithdrawalData();
        }

        chartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: data.labels,
                datasets: [{
                    label: 'Balance',
                    data: data.values,
                    borderColor: '#34c759',
                    backgroundColor: 'rgba(52, 199, 89, 0.1)',
                    borderWidth: 2,
                    tension: 0.4,
                    pointRadius: 4,
                    pointBackgroundColor: '#34c759'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: {
                    legend: {
                        display: false
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: {
                            callback: function(value) {
                                return '$' + (value / 1000).toFixed(0) + 'K';
                            }
                        }
                    },
                    x: {
                        title: {
                            display: true,
                            text: 'Years'
                        }
                    }
                }
            }
        });
    }

    function generateGrowthData() {
        const startBalance = parseFloat(removeCommas(document.getElementById('growth-balance').value)) || 0;
        const annualRate = (parseFloat(document.getElementById('growth-rate').value) || 0) / 100;
        const years = parseFloat(document.getElementById('growth-duration').value) || 0;
        const addition = parseFloat(removeCommas(document.getElementById('growth-addition').value)) || 0;
        const freq = currentFrequency.growth;
        const periodsPerYear = frequencyMultipliers[freq];
        
        const ratePerPeriod = annualRate / periodsPerYear;
        
        const labels = [];
        const values = [];
        
        let balance = startBalance;
        labels.push(0);
        values.push(balance);
        
        for (let year = 1; year <= years; year++) {
            for (let period = 0; period < periodsPerYear; period++) {
                balance = balance * (1 + ratePerPeriod) + addition;
            }
            labels.push(year);
            values.push(balance);
        }
        
        return { labels, values };
    }

    function generateWithdrawalData() {
        const startBalance = parseFloat(removeCommas(document.getElementById('withdrawal-balance').value)) || 0;
        const annualRate = (parseFloat(document.getElementById('withdrawal-rate').value) || 0) / 100;
        const years = parseFloat(document.getElementById('withdrawal-duration').value) || 0;
        const withdrawal = parseFloat(removeCommas(document.getElementById('withdrawal-amount').value)) || 0;
        const inflation = (parseFloat(document.getElementById('withdrawal-inflation').value) || 0) / 100;
        const freq = currentFrequency.withdrawal;
        const periodsPerYear = frequencyMultipliers[freq];
        
        const ratePerPeriod = annualRate / periodsPerYear;
        const inflationPerPeriod = inflation / periodsPerYear;
        
        const labels = [];
        const values = [];
        
        let balance = startBalance;
        let currentWithdrawal = withdrawal / periodsPerYear;
        
        labels.push(0);
        values.push(balance);
        
        for (let year = 1; year <= years; year++) {
            for (let period = 0; period < periodsPerYear; period++) {
                balance = balance * (1 + ratePerPeriod) - currentWithdrawal;
                if (balance < 0) balance = 0;
                currentWithdrawal *= (1 + inflationPerPeriod);
            }
            labels.push(year);
            values.push(Math.max(0, balance));
            
            if (balance <= 0) break;
        }
        
        return { labels, values };
    }

    // Reset button
    document.getElementById('reset').addEventListener('click', () => {
        if (currentMode === 'growth') {
            document.getElementById('growth-balance').value = 0;
            document.getElementById('growth-rate').value = 7;
